<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <h3>Time Manager</h3>
      <div>
        <button class="btn" id="toggle-details-button" onclick="toggleDetails()" title="Toggle the visibility of the details section.">Show Details</button>
        <button class="btn" id="btn-give-up" onclick="giveUp()">Give up</button>
        <button class="btn" id="btn-migrate" onclick="document.getElementById('modal-title').textContent = 'Migrate data?';document.getElementById('modal-body').textContent = 'Are you sure you want to migrate your local data to your Firebase account? This will override any existing data.';document.getElementById('btn-submit').textContent = 'Migrate';document.getElementById('btn-submit').onclick = function() { migrateToFirebase(); closeModal('modal'); };openModal('modal');" title="Transfer all of your local data to your account.">Migrate</button>
        <button class="btn" id="btn-reset" onclick="document.getElementById('modal-title').textContent = 'Reset all work time?';document.getElementById('modal-body').textContent = 'Are you sure you want to reset all work time to 0 and start all time scales today? This action cannot be undone.';document.getElementById('btn-submit').textContent = 'Reset';document.getElementById('btn-submit').onclick = function() { resetTimes(); closeModal('modal'); };openModal('modal');" title="Reset all work time to 0 and start all time scales today.">Reset</button>
        <button class="btn btn-primary" id="btn-help" onclick="openHelp()" title="Get help with using the app.">Help</button>
        <button class="btn btn-primary" id="btn-open-login" onclick="openLogin()" style="display:none;" title="Log in or register an account.">Log in</button>
      </div>
    </header>
    <main>
        <div id="root-tasks"></div>
        <div id="root-time-scales"></div>
        <div id="root-agenda"></div>
    </main>
    <!--<footer></footer>-->

    <div id="modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="close-btn" onclick="closeModal('modal')">×</button>
      </div>
      <div class="modal-body" id="modal-body">
        
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel" onclick="closeModal('modal')">Cancel</button>
        <button class="btn btn-primary" id="btn-submit"></button>
      </div>
    </div>
  </div>

  <div id="loading-overlay">
      <div class="spinner"></div>
  </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
